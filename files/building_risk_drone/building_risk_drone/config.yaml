# ==========================================================
# 건물 위험도 판별 모듈 - 설정 파일
# 이 파일의 숫자를 조정하는 것만으로 알고리즘 튜닝이 가능하도록 설계했습니다.
# ==========================================================

camera:
  source: 0            # 0=USB웹캠, "picam"=라즈베리파이 CSI 카메라, 또는 이미지/영상 파일 경로
  width: 640
  height: 480
  frame_skip: 2         # N프레임마다 1번만 분석 (라즈베리파이 성능 고려, 클수록 빠르지만 반응 느려짐)

detection:
  use_yolo: false                              # true로 바꾸면 딥러닝 모델 우선 사용, 모델 없으면 자동 폴백
  yolo_model_path: "models/damage_yolov8n.pt"   # 커스텀 학습 가중치 경로
  yolo_conf_threshold: 0.4
  classical_cv:                                 # 학습 데이터 없이도 동작하는 고전 영상처리 검출기 설정
    min_crack_length: 40      # px, 이보다 짧은 윤곽선은 무시
    min_aspect_ratio: 4.0     # 가로/세로 비율, 이 값 이상이어야 "길고 얇은" 균열 형태로 인정
    branching_fill_ratio: 0.15 # 이 값보다 면적충전율이 낮은 큰 구조물은 X자/망상형 교차균열로 별도 판정

risk_scoring:
  weights:                    # 개별 손상 하나의 심각도를 구성하는 가중치 (합 1.0 권장)
    length: 0.35
    width: 0.30
    orientation: 0.35
  orientation_weight:          # 균열 방향별 위험 가중치 (구조공학적 경험칙)
    vertical: 0.5              # 수직 균열: 상대적으로 위험도 낮음
    horizontal: 0.8            # 수평 균열: 휨(bending) 관련, 중간~높음
    diagonal: 1.0               # 대각선/사선 균열: 전단(shear) 관련, 위험
    branching: 1.0              # X자/망상형 교차 균열: 전단파괴 전조로 가장 위험
  width_danger_px: 15          # 이 폭(px) 이상이면 폭 기준 최대 위험도로 간주 (카메라 캘리브레이션 없을 때 상대 기준)
  frame_score_combo:           # 프레임 전체 점수 = 아래 3가지의 가중합
    max_w: 0.6                 # 가장 심각한 손상 1건의 영향력
    mean_w: 0.2                # 평균 심각도
    coverage_w: 0.2            # 손상이 차지하는 면적 비율

temporal_smoothing:            # 실시간 영상 프레임 간 노이즈로 인한 깜빡임 방지
  ema_alpha: 0.3                # 지수이동평균 계수 (클수록 최근 프레임에 민감)
  history_len: 15
  hysteresis:
    up_margin: 0                # 위험도가 "오를 때"는 즉시 반영 (안전 우선)
    down_margin: 8               # 위험도가 "내릴 때"는 더 보수적으로 (오탐 방지)

levels:                        # 0~100 점수를 4단계 위험 등급으로 매핑
  safe_max: 25                 # 0~25   : 안전
  caution_max: 50              # 26~50 : 주의
  danger_max: 75               # 51~75 : 위험
  # 76~100 : 심각 (자동)

alert:
  enabled: true
  trigger_level: "위험"         # 이 등급 이상이 되면 스냅샷 저장 + 로그 기록
  save_dir: "alerts"
  cooldown_sec: 10              # 동일 경보 재발송 최소 간격(초)
